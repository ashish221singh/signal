services:
  postgres:
    image: postgres:17-alpine
    container_name: signal-postgres
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal_local_dev
      POSTGRES_DB: signal
    ports:
      - "5433:5432"
    volumes:
      - signal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    container_name: signal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: signal
      MINIO_ROOT_PASSWORD: signal_local_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - signal_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 signal signal_local_dev;
      mc mb --ignore-existing local/signal-feedback-images;
      mc anonymous set download local/signal-feedback-images;
      exit 0;"

volumes:
  signal_pgdata:
  signal_minio:
