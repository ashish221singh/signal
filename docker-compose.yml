services:
  postgres:
    image: postgres:17-alpine
    container_name: signal-postgres
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal_local_dev
      POSTGRES_DB: signal
    ports:
      - "5433:5432"
    volumes:
      - signal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  signal_pgdata:
