<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>signal — feedback, at the speed you ship</title>
<meta name="description" content="You shipped it. But did it land?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box}
  :root{
    --term-bg:#0E0D0B;
    --line-faint:rgba(255,255,255,.06);
    --path:var(--info);
  }
  html,body{margin:0}
  body{
    min-height:100vh;color:var(--ink);
    font:500 15px/1.6 var(--font-mono);
    background:
      radial-gradient(120% 90% at 50% -20%,rgba(247,130,0,.08),transparent 55%),
      var(--term-bg);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ---------- subtle minimal header ---------- */
  .bar{position:sticky;top:0;z-index:20;
    background:color-mix(in srgb,var(--term-bg) 82%,transparent);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-faint)}
  .bar .in{max-width:1120px;margin:0 auto;height:56px;padding:0 28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{display:flex;align-items:center;gap:9px}
  .logo svg{width:19px;height:19px;color:var(--ink)}
  .logo .wm{font:600 16px/1 var(--font-mono);letter-spacing:-.02em}
  .tag{font:500 14px/1 var(--font-mono);color:var(--ink);white-space:nowrap}
  .tag .em{color:var(--action)}

  main{max-width:1120px;margin:0 auto;padding:0 28px}

  @media (max-width:640px){
    .bar .in,main{padding-left:20px;padding-right:20px}
    .tag{font-size:12px;white-space:normal;text-align:right;line-height:1.25}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="in">
    <a class="logo" href="#" aria-label="signal home">
      <svg viewBox="0 0 96 96" aria-hidden="true"><path fill="currentColor" d="M20 0 H76 Q96 0 96 20 V24 H30 Q24 24 24 30 Q24 36 30 36 H96 V76 Q96 96 76 96 H20 Q0 96 0 76 V72 H66 Q72 72 72 66 Q72 60 66 60 H0 V20 Q0 0 20 0 Z"/></svg>
      <span class="wm">signal</span>
    </a>
    <span class="tag">You shipped it. But did it <span class="em">land?</span></span>
  </div>
</header>

<main>
  <!-- content will be added below -->
</main>

</body>
</html>
